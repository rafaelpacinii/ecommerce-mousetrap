services:
  postgres:
    image: postgres:16-alpine
    container_name: mouse-store-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpasswd}
    volumes:
      - mouse-store-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mousetrap-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: mousetrap-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mousetrap-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mousetrap-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-db}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-dbuser}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dbpasswd}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mousetrap-network
    profiles:
      - full

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mousetrap-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api
    networks:
      - mousetrap-network
    profiles:
      - full

volumes:
  mouse-store-postgres-data:
    name: mouse-store-postgres-data

networks:
  mousetrap-network:
    name: mousetrap-network
    driver: bridge


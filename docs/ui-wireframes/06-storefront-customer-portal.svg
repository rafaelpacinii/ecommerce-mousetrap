<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Inter', 'Plus Jakarta Sans', 'Roboto', system-ui, -apple-system, sans-serif">
  <title>06 — Customer Portal: Meus Pedidos (/meus-pedidos)</title>
  <desc>Clean order tracking and history</desc>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122a"/>
      <stop offset="100%" stop-color="#1c1947"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="72%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#d1f5ff" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#7d53de" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a122a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0a122a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#f6f9fc"/>
  <!-- Clean Storefront Header (76px) -->
  <rect x="0" y="0" width="1440" height="76" fill="#ffffff"/>
  <line x1="0" y1="76" x2="1440" y2="76" stroke="#dde5f0"/>

  <!-- Logo -->
  <g transform="translate(80, 20)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0a122a"/>
    <rect x="15" y="7" width="6" height="12" rx="3" fill="#dacc3e"/>
    <text x="48" y="25" fill="#0a122a" font-size="19" font-weight="800" letter-spacing="-0.5">MOUSETRAP</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(320, 44)" font-size="14" font-weight="600">
    <text x="0" y="0" fill="#2c3652">Início</text>
    <text x="76" y="0" fill="#2c3652">Mouses</text>
    <text x="164" y="0" fill="#2c3652">Marcas</text>
    <text x="252" y="0" fill="#7d53de">Meus Pedidos</text>
  </g>

  <!-- Search Input -->
  <g transform="translate(860, 18)">
    <rect x="0" y="0" width="240" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="16" y="25" fill="#64708d" font-size="13">Buscar mouse...</text>
  </g>

  <!-- Actions: Cart + Entrar/Conta -->
  <g transform="translate(1116, 18)">
    <rect x="0" y="0" width="120" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="44" y="25" text-anchor="middle" fill="#0a122a" font-size="13" font-weight="700">Carrinho</text>
    <rect x="86" y="8" width="24" height="24" rx="6" fill="#dacc3e"/>
    <text x="98" y="25" text-anchor="middle" fill="#0a122a" font-size="12" font-weight="800">2</text>

    <rect x="132" y="0" width="112" height="40" rx="10" fill="#0a122a"/>
    <text x="188" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Minha Conta</text>
  </g>

  <!-- Left Account Navigation (268px) -->
  <g transform="translate(80, 116)" filter="url(#softShadow)">
    <rect x="0" y="0" width="268" height="320" rx="16" fill="#ffffff" stroke="#dde5f0"/>
    <circle cx="48" cy="52" r="22" fill="#0a122a"/>
    <text x="48" y="57" text-anchor="middle" fill="#dacc3e" font-size="14" font-weight="800">RP</text>
    <text x="82" y="48" fill="#0a122a" font-size="16" font-weight="800">Rafael Pacini</text>
    <text x="82" y="68" fill="#64708d" font-size="12">rafael@email.com</text>

    <line x1="24" y1="96" x2="244" y2="96" stroke="#dde5f0"/>

    <rect x="16" y="112" width="236" height="44" rx="10" fill="#f2edff"/>
    <text x="36" y="139" fill="#7d53de" font-size="14" font-weight="800">Meus Pedidos</text>

    <text x="36" y="187" fill="#2c3652" font-size="14" font-weight="600">Lista de Desejos</text>
    <text x="36" y="231" fill="#2c3652" font-size="14" font-weight="600">Meus Endereços</text>
    <text x="36" y="275" fill="#ef4444" font-size="14" font-weight="600">Sair da Conta</text>
  </g>

  <!-- Right Column: Active Order Tracking + Order History (972px) -->
  <g transform="translate(388, 116)" filter="url(#softShadow)">
    <!-- Active Order Card -->
    <rect x="0" y="0" width="972" height="336" rx="16" fill="#ffffff" stroke="#dde5f0"/>
    <text x="36" y="44" fill="#0a122a" font-size="18" font-weight="800">Pedido #1045</text>
    <text x="176" y="44" fill="#64708d" font-size="13">Realizado em 16 out 2026</text>

    <rect x="824" y="22" width="112" height="32" rx="8" fill="#e0f2fe"/>
    <text x="880" y="43" text-anchor="middle" fill="#075985" font-size="12" font-weight="800">Em Transporte</text>

    <line x1="36" y1="68" x2="936" y2="68" stroke="#dde5f0"/>

    <!-- Clean 4-Step Progress Timeline -->
    <g transform="translate(86, 118)">
      <line x1="0" y1="16" x2="800" y2="16" stroke="#dde5f0" stroke-width="4"/>
      <line x1="0" y1="16" x2="533" y2="16" stroke="#7d53de" stroke-width="4"/>

      <circle cx="0" cy="16" r="14" fill="#7d53de"/>
      <text x="0" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">✓</text>
      <text x="0" y="52" text-anchor="middle" fill="#0a122a" font-size="13" font-weight="700">Pedido Recebido</text>

      <circle cx="266" cy="16" r="14" fill="#7d53de"/>
      <text x="266" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">✓</text>
      <text x="266" y="52" text-anchor="middle" fill="#0a122a" font-size="13" font-weight="700">Pagamento Aprovado</text>

      <circle cx="533" cy="16" r="14" fill="#7d53de"/>
      <circle cx="533" cy="16" r="5" fill="#dacc3e"/>
      <text x="533" y="52" text-anchor="middle" fill="#7d53de" font-size="13" font-weight="800">Enviado</text>

      <circle cx="800" cy="16" r="14" fill="#ffffff" stroke="#c2cde0" stroke-width="3"/>
      <text x="800" y="52" text-anchor="middle" fill="#64708d" font-size="13" font-weight="600">Entregue</text>
    </g>

    <!-- Order Item Summary Box -->
    <rect x="36" y="212" width="900" height="92" rx="12" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="64" y="250" fill="#0a122a" font-size="15" font-weight="800">1x Razer Viper V3 Pro  ·  1x G Pro X Superlight 2</text>
    <text x="64" y="276" fill="#64708d" font-size="13">Código de rastreio: BR492018429BR</text>
    <text x="904" y="264" text-anchor="end" fill="#0a122a" font-size="20" font-weight="800" font-family="monospace">R$ 2.179,70</text>

    <!-- Previous Orders Section -->
    <text x="0" y="388" fill="#0a122a" font-size="20" font-weight="800">Pedidos Anteriores</text>

    <g transform="translate(0, 412)">
      <rect x="0" y="0" width="972" height="112" rx="16" fill="#ffffff" stroke="#dde5f0"/>
      <text x="36" y="46" fill="#0a122a" font-size="16" font-weight="800">Pedido #1018</text>
      <text x="36" y="74" fill="#64708d" font-size="13">1x Lamzu Atlantis Mini 4K  ·  Entregue em 02 set 2026</text>

      <rect x="640" y="40" width="104" height="32" rx="8" fill="#e6f9f1"/>
      <text x="692" y="61" text-anchor="middle" fill="#065f46" font-size="12" font-weight="800">Entregue</text>

      <text x="936" y="62" text-anchor="end" fill="#0a122a" font-size="18" font-weight="800" font-family="monospace">R$ 749,90</text>
    </g>

    <g transform="translate(0, 544)">
      <rect x="0" y="0" width="972" height="112" rx="16" fill="#ffffff" stroke="#dde5f0"/>
      <text x="36" y="46" fill="#0a122a" font-size="16" font-weight="800">Pedido #0984</text>
      <text x="36" y="74" fill="#64708d" font-size="13">1x Pulsar X2V2 Mini  ·  Entregue em 14 ago 2026</text>

      <rect x="640" y="40" width="104" height="32" rx="8" fill="#e6f9f1"/>
      <text x="692" y="61" text-anchor="middle" fill="#065f46" font-size="12" font-weight="800">Entregue</text>

      <text x="936" y="62" text-anchor="end" fill="#0a122a" font-size="18" font-weight="800" font-family="monospace">R$ 699,90</text>
    </g>
  </g>
</svg>

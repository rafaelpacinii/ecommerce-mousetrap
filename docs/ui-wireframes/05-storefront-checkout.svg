<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Inter', 'Plus Jakarta Sans', 'Roboto', system-ui, -apple-system, sans-serif">
  <title>05 — Storefront Checkout (/checkout)</title>
  <desc>Clean 2-step checkout screen</desc>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122a"/>
      <stop offset="100%" stop-color="#1c1947"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="72%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#d1f5ff" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#7d53de" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a122a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0a122a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#f6f9fc"/>
  <!-- Clean Storefront Header (76px) -->
  <rect x="0" y="0" width="1440" height="76" fill="#ffffff"/>
  <line x1="0" y1="76" x2="1440" y2="76" stroke="#dde5f0"/>

  <!-- Logo -->
  <g transform="translate(80, 20)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0a122a"/>
    <rect x="15" y="7" width="6" height="12" rx="3" fill="#dacc3e"/>
    <text x="48" y="25" fill="#0a122a" font-size="19" font-weight="800" letter-spacing="-0.5">MOUSETRAP</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(320, 44)" font-size="14" font-weight="600">
    <text x="0" y="0" fill="#2c3652">Início</text>
    <text x="76" y="0" fill="#7d53de">Mouses</text>
    <text x="164" y="0" fill="#2c3652">Marcas</text>
    <text x="252" y="0" fill="#2c3652">Meus Pedidos</text>
  </g>

  <!-- Search Input -->
  <g transform="translate(860, 18)">
    <rect x="0" y="0" width="240" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="16" y="25" fill="#64708d" font-size="13">Buscar mouse...</text>
  </g>

  <!-- Actions: Cart + Entrar/Conta -->
  <g transform="translate(1116, 18)">
    <rect x="0" y="0" width="120" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="44" y="25" text-anchor="middle" fill="#0a122a" font-size="13" font-weight="700">Carrinho</text>
    <rect x="86" y="8" width="24" height="24" rx="6" fill="#dacc3e"/>
    <text x="98" y="25" text-anchor="middle" fill="#0a122a" font-size="12" font-weight="800">2</text>

    <rect x="132" y="0" width="112" height="40" rx="10" fill="#0a122a"/>
    <text x="188" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Minha Conta</text>
  </g>

  <text x="80" y="132" fill="#0a122a" font-size="28" font-weight="800">Finalizar Compra</text>
  <text x="80" y="158" fill="#64708d" font-size="14">Confirme o endereço de entrega e escolha a forma de pagamento</text>

  <!-- Left Column: Address + Payment Selection (800px) -->
  <g transform="translate(80, 188)" filter="url(#softShadow)">
    <!-- Step 1: Delivery Address -->
    <rect x="0" y="0" width="800" height="236" rx="16" fill="#ffffff" stroke="#dde5f0"/>
    <text x="32" y="44" fill="#0a122a" font-size="18" font-weight="800">1. Endereço de Entrega</text>
    <text x="768" y="44" text-anchor="end" fill="#7d53de" font-size="13" font-weight="700">+ Novo endereço</text>

    <rect x="32" y="68" width="736" height="136" rx="12" fill="#eef8ff" stroke="#7d53de" stroke-width="2"/>
    <circle cx="60" cy="100" r="9" fill="#7d53de"/>
    <circle cx="60" cy="100" r="4" fill="#ffffff"/>
    <text x="84" y="105" fill="#0a122a" font-size="16" font-weight="800">Endereço Principal</text>
    <text x="84" y="134" fill="#2c3652" font-size="14">Quadra 104 Sul, Avenida JK, Lote 12, Sala 04 — Plano Diretor Sul</text>
    <text x="84" y="160" fill="#64708d" font-size="13">Palmas / TO · CEP 77020-020</text>

    <!-- Step 2: Payment Method -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="800" height="260" rx="16" fill="#ffffff" stroke="#dde5f0"/>
      <text x="32" y="44" fill="#0a122a" font-size="18" font-weight="800">2. Forma de Pagamento</text>

      <!-- PIX Option -->
      <rect x="32" y="68" width="356" height="156" rx="12" fill="#eef8ff" stroke="#7d53de" stroke-width="2"/>
      <circle cx="60" cy="100" r="9" fill="#7d53de"/>
      <circle cx="60" cy="100" r="4" fill="#ffffff"/>
      <text x="82" y="105" fill="#0a122a" font-size="16" font-weight="800">PIX</text>
      <text x="60" y="140" fill="#2c3652" font-size="13">Aprovação imediata com QR Code.</text>
      <rect x="60" y="164" width="144" height="28" rx="6" fill="#e6f9f1"/>
      <text x="132" y="183" text-anchor="middle" fill="#065f46" font-size="11" font-weight="800">Liberação Imediata</text>

      <!-- Credit Card Option -->
      <rect x="412" y="68" width="356" height="156" rx="12" fill="#ffffff" stroke="#dde5f0"/>
      <circle cx="440" cy="100" r="9" fill="#ffffff" stroke="#c2cde0" stroke-width="2"/>
      <text x="462" y="105" fill="#0a122a" font-size="16" font-weight="800">Cartão de Crédito</text>
      <text x="440" y="140" fill="#64708d" font-size="13">Em até 10x sem juros no cartão.</text>
    </g>
  </g>

  <!-- Right Column: Order Confirmation Card (440px) -->
  <g transform="translate(920, 188)" filter="url(#softShadow)">
    <rect x="0" y="0" width="440" height="420" rx="16" fill="#ffffff" stroke="#dde5f0"/>
    <text x="32" y="44" fill="#0a122a" font-size="18" font-weight="800">Resumo da Compra</text>
    <line x1="32" y1="64" x2="408" y2="64" stroke="#dde5f0"/>

    <text x="32" y="102" fill="#2c3652" font-size="14">1x Razer Viper V3 Pro</text>
    <text x="408" y="102" text-anchor="end" fill="#0a122a" font-size="14" font-weight="700" font-family="monospace">R$ 1.199,90</text>

    <text x="32" y="136" fill="#2c3652" font-size="14">1x G Pro X Superlight 2</text>
    <text x="408" y="136" text-anchor="end" fill="#0a122a" font-size="14" font-weight="700" font-family="monospace">R$ 949,90</text>

    <line x1="32" y1="166" x2="408" y2="166" stroke="#dde5f0"/>

    <text x="32" y="200" fill="#64708d" font-size="14">Subtotal</text>
    <text x="408" y="200" text-anchor="end" fill="#0a122a" font-size="14" font-weight="700" font-family="monospace">R$ 2.149,80</text>

    <text x="32" y="232" fill="#64708d" font-size="14">Frete</text>
    <text x="408" y="232" text-anchor="end" fill="#0a122a" font-size="14" font-weight="700" font-family="monospace">R$ 29,90</text>

    <line x1="32" y1="260" x2="408" y2="260" stroke="#dde5f0"/>

    <text x="32" y="300" fill="#0a122a" font-size="18" font-weight="800">Total a pagar</text>
    <text x="408" y="300" text-anchor="end" fill="#0a122a" font-size="24" font-weight="800" font-family="monospace">R$ 2.179,70</text>

    <rect x="32" y="336" width="376" height="54" rx="12" fill="#dacc3e"/>
    <text x="220" y="369" text-anchor="middle" fill="#0a122a" font-size="16" font-weight="800">Confirmar Pedido</text>
  </g>
</svg>

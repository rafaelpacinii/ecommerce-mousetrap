<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Inter', 'Plus Jakarta Sans', 'Roboto', system-ui, -apple-system, sans-serif">
  <title>04 — Storefront Shopping Cart (/carrinho)</title>
  <desc>Clean 2-column shopping cart and summary</desc>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122a"/>
      <stop offset="100%" stop-color="#1c1947"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="72%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#d1f5ff" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#7d53de" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a122a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0a122a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#f6f9fc"/>
  <!-- Clean Storefront Header (76px) -->
  <rect x="0" y="0" width="1440" height="76" fill="#ffffff"/>
  <line x1="0" y1="76" x2="1440" y2="76" stroke="#dde5f0"/>

  <!-- Logo -->
  <g transform="translate(80, 20)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0a122a"/>
    <rect x="15" y="7" width="6" height="12" rx="3" fill="#dacc3e"/>
    <text x="48" y="25" fill="#0a122a" font-size="19" font-weight="800" letter-spacing="-0.5">MOUSETRAP</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(320, 44)" font-size="14" font-weight="600">
    <text x="0" y="0" fill="#2c3652">Início</text>
    <text x="76" y="0" fill="#7d53de">Mouses</text>
    <text x="164" y="0" fill="#2c3652">Marcas</text>
    <text x="252" y="0" fill="#2c3652">Meus Pedidos</text>
  </g>

  <!-- Search Input -->
  <g transform="translate(860, 18)">
    <rect x="0" y="0" width="240" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="16" y="25" fill="#64708d" font-size="13">Buscar mouse...</text>
  </g>

  <!-- Actions: Cart + Entrar/Conta -->
  <g transform="translate(1116, 18)">
    <rect x="0" y="0" width="120" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="44" y="25" text-anchor="middle" fill="#0a122a" font-size="13" font-weight="700">Carrinho</text>
    <rect x="86" y="8" width="24" height="24" rx="6" fill="#dacc3e"/>
    <text x="98" y="25" text-anchor="middle" fill="#0a122a" font-size="12" font-weight="800">2</text>

    <rect x="132" y="0" width="112" height="40" rx="10" fill="#0a122a"/>
    <text x="188" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Minha Conta</text>
  </g>

  <text x="80" y="132" fill="#0a122a" font-size="28" font-weight="800">Seu Carrinho</text>
  <text x="80" y="158" fill="#64708d" font-size="14">Revise seus produtos antes de finalizar a compra</text>

  <!-- Left Column: 2 Spacious Cart Item Cards (800px) -->
  <g transform="translate(80, 188)" filter="url(#softShadow)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="800" height="156" rx="16" fill="#ffffff" stroke="#dde5f0"/>
    <rect x="20" y="20" width="116" height="116" rx="12" fill="#eef8ff"/>
      <g transform="translate(78,78) scale(0.65)">
    <ellipse cx="0" cy="4" rx="36" ry="54" fill="#d1f5ff" opacity="0.35"/>
    <rect x="-26" y="-44" width="52" height="88" rx="26" fill="#0a122a" stroke="#dacc3e" stroke-width="2"/>
    <line x1="0" y1="-44" x2="0" y2="-8" stroke="#dacc3e" stroke-width="1.5" opacity="0.7"/>
    <path d="M -25,-8 Q 0,-2 25,-8" fill="none" stroke="#dacc3e" stroke-width="1.5" opacity="0.7"/>
    <rect x="-4" y="-34" width="8" height="18" rx="4" fill="#dacc3e"/>
  </g>

    <text x="160" y="48" fill="#7d53de" font-size="11" font-weight="800">RAZER</text>
    <text x="160" y="74" fill="#0a122a" font-size="18" font-weight="800">Razer Viper V3 Pro</text>
    <text x="160" y="100" fill="#64708d" font-size="13">Sem Fio · 54g · 8000 Hz</text>
    <text x="160" y="126" fill="#ef4444" font-size="12" font-weight="700">Remover item</text>

    <!-- Stepper -->
    <g transform="translate(490, 58)">
      <rect x="0" y="0" width="108" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
      <text x="20" y="25" text-anchor="middle" fill="#0a122a" font-size="16" font-weight="800">−</text>
      <text x="54" y="25" text-anchor="middle" fill="#0a122a" font-size="14" font-weight="800">1</text>
      <text x="88" y="25" text-anchor="middle" fill="#0a122a" font-size="16" font-weight="800">+</text>
    </g>

    <text x="768" y="84" text-anchor="end" fill="#0a122a" font-size="20" font-weight="800" font-family="monospace">R$ 1.199,90</text>

    <!-- Item 2 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="800" height="156" rx="16" fill="#ffffff" stroke="#dde5f0"/>
      <rect x="20" y="20" width="116" height="116" rx="12" fill="#eef8ff"/>
        <g transform="translate(78,78) scale(0.65)">
    <ellipse cx="0" cy="4" rx="36" ry="54" fill="#d1f5ff" opacity="0.35"/>
    <rect x="-26" y="-44" width="52" height="88" rx="26" fill="#0a122a" stroke="#7d53de" stroke-width="2"/>
    <line x1="0" y1="-44" x2="0" y2="-8" stroke="#7d53de" stroke-width="1.5" opacity="0.7"/>
    <path d="M -25,-8 Q 0,-2 25,-8" fill="none" stroke="#7d53de" stroke-width="1.5" opacity="0.7"/>
    <rect x="-4" y="-34" width="8" height="18" rx="4" fill="#7d53de"/>
  </g>

      <text x="160" y="48" fill="#7d53de" font-size="11" font-weight="800">LOGITECH G</text>
      <text x="160" y="74" fill="#0a122a" font-size="18" font-weight="800">G Pro X Superlight 2</text>
      <text x="160" y="100" fill="#64708d" font-size="13">Sem Fio · 60g · 4000 Hz</text>
      <text x="160" y="126" fill="#ef4444" font-size="12" font-weight="700">Remover item</text>

      <g transform="translate(490, 58)">
        <rect x="0" y="0" width="108" height="40" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
        <text x="20" y="25" text-anchor="middle" fill="#0a122a" font-size="16" font-weight="800">−</text>
        <text x="54" y="25" text-anchor="middle" fill="#0a122a" font-size="14" font-weight="800">1</text>
        <text x="88" y="25" text-anchor="middle" fill="#0a122a" font-size="16" font-weight="800">+</text>
      </g>

      <text x="768" y="84" text-anchor="end" fill="#0a122a" font-size="20" font-weight="800" font-family="monospace">R$ 949,90</text>
    </g>
  </g>

  <!-- Right Column: Clean Order Summary (440px) -->
  <g transform="translate(920, 188)" filter="url(#softShadow)">
    <rect x="0" y="0" width="440" height="460" rx="16" fill="#ffffff" stroke="#dde5f0"/>
    <text x="32" y="44" fill="#0a122a" font-size="18" font-weight="800">Resumo do Pedido</text>
    <line x1="32" y1="64" x2="408" y2="64" stroke="#dde5f0"/>

    <text x="32" y="100" fill="#2c3652" font-size="13" font-weight="700">Calcular Entrega (CEP)</text>
    <rect x="32" y="114" width="240" height="42" rx="10" fill="#eef8ff" stroke="#dde5f0"/>
    <text x="48" y="140" fill="#0a122a" font-size="14" font-family="monospace">77001-000</text>
    <rect x="284" y="114" width="124" height="42" rx="10" fill="#0a122a"/>
    <text x="346" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Calcular</text>

    <line x1="32" y1="184" x2="408" y2="184" stroke="#dde5f0"/>

    <text x="32" y="220" fill="#64708d" font-size="14">Subtotal (2 itens)</text>
    <text x="408" y="220" text-anchor="end" fill="#0a122a" font-size="15" font-weight="700" font-family="monospace">R$ 2.149,80</text>

    <text x="32" y="256" fill="#64708d" font-size="14">Frete</text>
    <text x="408" y="256" text-anchor="end" fill="#0a122a" font-size="15" font-weight="700" font-family="monospace">R$ 29,90</text>

    <line x1="32" y1="286" x2="408" y2="286" stroke="#dde5f0"/>

    <text x="32" y="328" fill="#0a122a" font-size="18" font-weight="800">Total</text>
    <text x="408" y="328" text-anchor="end" fill="#0a122a" font-size="24" font-weight="800" font-family="monospace">R$ 2.179,70</text>

    <rect x="32" y="368" width="376" height="54" rx="12" fill="#dacc3e"/>
    <text x="220" y="401" text-anchor="middle" fill="#0a122a" font-size="15" font-weight="800">Continuar para o Checkout</text>
  </g>
</svg>

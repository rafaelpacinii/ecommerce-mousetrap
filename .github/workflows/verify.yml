name: Verify release
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: ecommerce_test
          POSTGRES_PASSWORD: ecommerce_test
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce_test -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -Prelease clean verify
        working-directory: api
      - name: Verify local configuration exclusion
        run: test ! -f api/target/classes/application.properties
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm test -- --watch=false
      - run: npm run build
  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API container image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          load: true
          tags: mousetrap-api:scan
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Scan API container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mousetrap-api:scan
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Build Web container image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          load: true
          tags: mousetrap-web:scan
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan Web container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mousetrap-web:scan
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: sh scripts/verify_release.sh
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: mousetrap-source-submission
          path: dist/mousetrap_submission.zip
          retention-days: 7

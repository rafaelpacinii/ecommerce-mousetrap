map $request_uri $robots {
    default "";
    ~^/(carrinho|checkout|login|cadastro|auth|acesso-negado|minha-conta|meus-pedidos|lista-de-desejos|admin)(/|[?]|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag $robots always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /config.json {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html { expires -1; }
    location = /silent-check-sso.html { expires -1; }

    # Only Angular's content-hashed files are immutable.
    location ~* "-[A-Z0-9_-]{8,}\.(js|css|woff2)$" {
        expires 1y;
        try_files $uri =404;
    }
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|woff2?|ttf|svg|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }
}

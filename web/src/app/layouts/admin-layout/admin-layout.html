<header class="topo">
  <a class="identidade" routerLink="/"
    ><img src="favicon.svg" width="36" height="36" alt="" /><span
      >MouseTrap<small>Administração do catálogo</small></span
    ></a
  >
  <nav aria-label="Administração">
    <a routerLink="/"><mat-icon aria-hidden="true">storefront</mat-icon>Loja</a>
    <a routerLink="/admin/marcas" routerLinkActive="selecionado" ariaCurrentWhenActive="page"
      ><mat-icon aria-hidden="true">loyalty</mat-icon>Marcas</a
    >
    <a routerLink="/admin/mouses" routerLinkActive="selecionado" ariaCurrentWhenActive="page"
      ><mat-icon aria-hidden="true">mouse</mat-icon>Mouses</a
    >
    <a routerLink="/admin/clientes" routerLinkActive="selecionado" ariaCurrentWhenActive="page"
      ><mat-icon aria-hidden="true">people</mat-icon>Clientes</a
    >
    <a routerLink="/minha-conta"
      ><mat-icon aria-hidden="true">account_circle</mat-icon>Minha conta</a
    >
    <button type="button" (click)="auth.logout()">
      <mat-icon aria-hidden="true">logout</mat-icon>Sair
    </button>
  </nav>
</header>
<main id="conteudo" tabindex="-1"><router-outlet /></main>

<header class="store-header" (keydown.escape)="menuAberto.set(false)">
  <div class="store-container header-content">
    <a class="brand" routerLink="/" aria-label="MouseTrap — Início" (click)="menuAberto.set(false)">
      <img src="favicon.svg" width="38" height="38" alt="" />
      <span>MOUSETRAP<small>PRECISÃO EM SUAS MÃOS</small></span>
    </a>
    <button
      class="menu-toggle"
      type="button"
      aria-controls="store-navigation"
      [attr.aria-expanded]="menuAberto()"
      (click)="menuAberto.set(!menuAberto())"
    >
      {{ menuAberto() ? 'Fechar' : 'Menu' }}
      <mat-icon aria-hidden="true">{{ menuAberto() ? 'close' : 'menu' }}</mat-icon>
    </button>
    <nav id="store-navigation" aria-label="Navegação da loja" [class.is-open]="menuAberto()">
      <a routerLink="/" (click)="menuAberto.set(false)"
        ><mat-icon aria-hidden="true">home</mat-icon>Início</a
      >
      <a routerLink="/catalogo" (click)="menuAberto.set(false)"
        ><mat-icon aria-hidden="true">mouse</mat-icon>Mouses</a
      >
      <a routerLink="/" fragment="pegadas" (click)="menuAberto.set(false)"
        ><mat-icon aria-hidden="true">pan_tool</mat-icon>Encontre sua pegada</a
      >
    </nav>
    <a class="header-search" routerLink="/catalogo" aria-label="Buscar mouses">
      <mat-icon aria-hidden="true">search</mat-icon>
      <span>Buscar mouse</span>
    </a>
  </div>
</header>
<main id="conteudo" tabindex="-1"><router-outlet /></main>
<footer class="store-footer">
  <div class="store-container footer-content">
    <div>
      <a class="brand" routerLink="/" aria-label="MouseTrap — Início">
        <img src="favicon.svg" width="36" height="36" alt="" />
        <span>MOUSETRAP</span>
      </a>
      <p>O próximo movimento é seu.</p>
    </div>
    <nav aria-label="Navegação do rodapé">
      <a routerLink="/catalogo"><mat-icon aria-hidden="true">mouse</mat-icon>Mouses</a>
      <a routerLink="/" fragment="pegadas"
        ><mat-icon aria-hidden="true">pan_tool</mat-icon>Guia de pegadas</a
      >
      <a routerLink="/marcas"><mat-icon aria-hidden="true">settings</mat-icon>Administração</a>
    </nav>
  </div>
  <div class="store-container footer-bottom">MouseTrap · Mouses para o seu jeito de jogar.</div>
</footer>

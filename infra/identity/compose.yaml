name: mousetrap-identity
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - identity-data:/opt/keycloak/data
      - ./realm:/opt/keycloak/data/import:ro
      - ./themes/mousetrap:/opt/keycloak/themes/mousetrap:ro
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - 127.0.0.1:8025:8025
volumes:
  identity-data:

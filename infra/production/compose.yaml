# Production / staging Compose stack consuming pre-built GHCR images.
# Requires a private environment file (.local/production/stack.env) and an HTTPS reverse proxy.
# See docs/release-readiness.md before exposing a host.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mousetrap
      POSTGRES_USER: mousetrap
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Supply DATABASE_PASSWORD in stack.env}
    volumes:
      - app-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mousetrap -d mousetrap']
      interval: 5s
      timeout: 5s
      retries: 30

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Supply IDENTITY_DATABASE_PASSWORD in stack.env}
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: [${KEYCLOAK_COMMAND:-start-dev}, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DATABASE_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Supply IDENTITY_ADMIN_PASSWORD in stack.env}
      KC_HOSTNAME: ${PUBLIC_IDENTITY_URL:?Required public identity URL}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${IDENTITY_PORT:-8180}:8080'
    volumes:
      - ${REALM_DIRECTORY:?Supply REALM_DIRECTORY in stack.env}:/opt/keycloak/data/import:ro
      - ${THEME_DIRECTORY:-../identity/themes/mousetrap}:/opt/keycloak/themes/mousetrap:ro
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3' | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    image: ${API_IMAGE:-ghcr.io/rafaelpacinii/mousetrap-api:latest}
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/mousetrap
      QUARKUS_DATASOURCE_USERNAME: mousetrap
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/mousetrap
      QUARKUS_OIDC_DISCOVERY_ENABLED: 'false'
      QUARKUS_OIDC_JWKS_PATH: /protocol/openid-connect/certs
      QUARKUS_OIDC_TOKEN_ISSUER: ${PUBLIC_IDENTITY_URL}/realms/mousetrap
      WEB_ORIGIN: ${PUBLIC_WEB_URL:?Required public web URL}
      PAGAMENTOS_SIMULACAO_HABILITADA: ${PAYMENT_DEMO_ENABLED:-false}
      VIACEP_URL: ${VIACEP_URL:-https://viacep.com.br/ws/}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /q/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; cat <&3' | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${WEB_IMAGE:-ghcr.io/rafaelpacinii/mousetrap-web:latest}
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Required public API URL}
      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}
    ports:
      - '127.0.0.1:${WEB_PORT:-4200}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:80/']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-data:
  identity-data:

